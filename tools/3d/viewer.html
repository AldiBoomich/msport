const q = new URLSearchParams(location.search);

if (q.get('env') === 'city') {

  // hdr=…, hdri= HDRI intensity, hrot= HDRI yaw (deg; 180 puts the Pudong skyline behind the car in the wide shots and keeps the Bund's trees
  // out of frame; 270 = the old gold-lit facades), lf= lightformer intensity (0 = HDRI only), gk= road brightness
  // sky=<prefix>: the packed panorama the site loads (hdr-pack.mjs → city-sky.js) instead of the .hdr
  const SKY = q.get('sky');
  const [{ nightEnvironment }, hdr] = await Promise.all([import('./car-env.js'),
    SKY ? import('./city-sky.js').then(m => m.loadCitySky(SKY)) : new RGBELoader().loadAsync(q.get('hdr') || '/hdri/shanghai_bund_4k.hdr')]);

} else if (q.get('env') === 'zebra') {

  // in a 1024 px cube. On a mirror finish the bands run smooth on a good surface, kink on a crease
  // and wobble where the mesh is lumpy.
  const es = new THREE.Scene();

    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec3 vD; void main(){
  float el = asin(clamp(normalize(vD).y, -1.0, 1.0)) / 1.5708;
  float b = smoothstep(0.47, 0.53, abs(fract(el * ${N}.0) - 0.5) * 2.0);
  vec3 c = el < -0.02 ? vec3(0.06) : mix(vec3(0.02), vec3(2.2), b);
  gl_FragColor = vec4(c, 1.0); }` })));

  bar(0.5, 0.06, 14, -2.6, 5.2, 0, 0xffb070, 2.5); // warm sodium line, left
  bar(16, 1.2, 0.2, 0, 1.4, -9, 0x8fa6c8, 0.35);   // cool horizon glow behind
  bar(16, 0.6, 0.2, 0, 1.0, 9, 0x8fa6c8, 0.2);     // faint horizon in front
  bar(0.15, 3, 0.15, 6, 3, 2, 0xffffff, 3);        // vertical kicker for side highlight
  scene.environment = pmrem.fromScene(es, 0.02).texture;

  env.mapping = THREE.EquirectangularReflectionMapping;

}

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync(q.get('model'));
const root = gltf.scene;
// normalise: length (longest horizontal axis) = 4.85 m, on ground, centred
let box = new THREE.Box3().setFromObject(root); let size = box.getSize(new THREE.Vector3());
const s = 4.85 / Math.max(size.x, size.z); root.scale.multiplyScalar(s);
box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3());
root.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
scene.add(root);

const mode = q.get('mode') || 'orig';
// Black Sapphire Metallic: dark metallic base + glossy clear coat + fine flakes
function flakeTexture() {

  metalness: +(q.get('met') || 0.45), roughness: +(q.get('rough') || 0.32),
  clearcoat: 1, clearcoatRoughness: +(q.get('cc') || 0.02),

    .replace('#include <clearcoat_normal_fragment_maps>', `#include <clearcoat_normal_fragment_maps>
{

  clearcoatNormal = normalize(clearcoatNormal + (viewMatrix * vec4(peelGrad(vWp) * ${(+q.get('peel')).toFixed(4)} * peelAA, 0.0)).xyz);

  // ends up first and the carbon roof overrides it; no flakes in the carbon

    .replace('#include <common>', `#include <common>
float roofMask() {
  return smoothstep(${CARBON.y0.toFixed(3)}, ${(CARBON.y0 + 0.02).toFixed(3)}, vWp.y)
    * (1.0 - smoothstep(${(CARBON.x0 - 0.04).toFixed(3)}, ${CARBON.x0.toFixed(3)}, abs(vWp.x)))
    * smoothstep(${CARBON.z0.toFixed(3)}, ${(CARBON.z0 + 0.04).toFixed(3)}, vWp.z)
    * (1.0 - smoothstep(${(CARBON.z1 - 0.04).toFixed(3)}, ${CARBON.z1.toFixed(3)}, vWp.z));

vec3 twill(vec2 p) {

    .replace('#include <color_fragment>', `#include <color_fragment>

};

  const t0 = performance.now();

    }

      if (!o.isMesh) return;

      o.castShadow = !/glass/.test(n); // the glass lets light into the cabin
      o.receiveShadow = true;
    });
    g.receiveShadow = true;
  }
  // contact shadow: baked under the car (shadowtex=…, from bl_bake_ao.py), or the old soft blob
  if (q.get('shadowtex')) {
    const { contactShadow } = await import('./car-shading.js');
    const st = await new THREE.TextureLoader().loadAsync(q.get('shadowtex'));
    scene.add(contactShadow(st));
  } else {
    const sh = document.createElement('canvas'); sh.width = sh.height = 256; const cx = sh.getContext('2d');
    const grd = cx.createRadialGradient(128, 128, 10, 128, 128, 128); grd.addColorStop(0, 'rgba(0,0,0,0.85)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = grd; cx.fillRect(0, 0, 256, 256);
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 5.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sh), transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.005; scene.add(shadow);
  }
}

// road: CC0 asphalt, lane lines (car drives towards +z in the right lane; its left side is +x)
// fx=1 (chapter-fx.js): the road scrolls under the car; roadD = distance driven (moves the puddles too)
const FX = mode === 'final' && q.get('fx') === '1';
const roadMaps = [], dashes = [], roadD = { value: 0 };
let paintLine = null;
if (q.get('road')) {
  const tl = new THREE.TextureLoader();
  const tex = (f, srgb) => { const t = tl.load('/tex/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 24); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; roadMaps.push(t); return t; };
  g.material = new THREE.MeshStandardMaterial({ map: tex('asphalt_track_diff_1k.jpg', true), normalMap: tex('asphalt_track_nor_gl_1k.jpg'), roughnessMap: tex('asphalt_track_rough_1k.jpg'), color: 0x3a3d42, roughness: 0.9, metalness: 0.05, normalScale: new THREE.Vector2(0.6, 0.6) });
  paintLine = new THREE.MeshStandardMaterial({ color: 0x8a8a84, roughness: 0.7 });
  for (let z = -30; z < 30; z += 6) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 3), paintLine); m.rotation.x = -Math.PI / 2; m.position.set(1.95, 0.004, z); scene.add(m); dashes.push(m); }
  const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 60), paintLine); edge.rotation.x = -Math.PI / 2; edge.position.set(-1.75, 0.004, 0); scene.add(edge);
  // damp night road (wet=0 to compare, wetk= amount): large patches of standing water from a world-space
  // fbm; there the asphalt darkens, its micro-normals flatten and it turns glossy, so the city lights and
  // lamps streak in it. The rest stays damp-satin. Lane paint is worn in small flecks.
  if (mode === 'final' && q.get('wet') !== '0') {
    const WK = (+(q.get('wetk') || 1)).toFixed(3);
    const NOISE = `
float wHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float wNoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(wHash(i), wHash(i + vec2(1, 0)), f.x), mix(wHash(i + vec2(0, 1)), wHash(i + 1.0), f.x), f.y); }
float wFbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * wNoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
uniform float uRoadD;
vec2 roadXZ() { return vWp.xz + vec2(0.0, uRoadD); } // road-fixed coordinates (the road moves towards -z)
float wetMask() { return clamp((0.22 + 0.78 * smoothstep(0.52, 0.64, wFbm(roadXZ() * 0.32))) * ${WK}, 0.0, 1.0); }
// the env map does not contain the car: where the black car stands over the road its reflection must be
// dark, so reflections fade out over a soft footprint a little larger than the car
float carOcc() { return mix(1.0, 0.06, (1.0 - smoothstep(0.85, 1.7, abs(vWp.x))) * (1.0 - smoothstep(2.3, 3.4, abs(vWp.z)))); }`;
    const wetPatch = (sh, extraColour = '') => {
      withWorldPos(sh);
      sh.uniforms.uRoadD = roadD;
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\n' + NOISE)
        .replace('#include <color_fragment>', `#include <color_fragment>
float wet = wetMask();
${extraColour}
diffuseColor.rgb *= mix(1.0, 0.42, wet);`)
        .replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.05, wet * wet);')
        .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\nnormal = normalize(mix(normal, nonPerturbedNormal, wet * 0.9));')
        .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\nreflectedLight.indirectSpecular *= carOcc();');
    };

    for (const m of [g.material, paintLine]) { m.envMap = scene.environment; m.envMapIntensity = +(q.get('wetenv') || 0.5); }
    g.material.onBeforeCompile = sh => wetPatch(sh);
    g.material.customProgramCacheKey = () => 'wet-road';
    paintLine.onBeforeCompile = sh => wetPatch(sh, 'diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.035), smoothstep(0.5, 0.72, wFbm(roadXZ() * 9.0)) * 0.85);');
    paintLine.customProgramCacheKey = () => 'wet-line';
  }
  await new Promise(r => setTimeout(r, 1500)); // let the textures arrive
}

// chapter key (tools/3d/chapters.js), or explicit cam / tgt / fov, or the old az / el / d orbit
const portrait = H > W;
let key = null;
if (q.get('chapter')) {
  const { CHAPTERS } = await import('./chapters.js');
  const ch = CHAPTERS[+q.get('chapter') - 1];
  key = portrait && ch.mobile ? { ...ch, ...ch.mobile } : ch;
}
if (q.get('cam')) key = { ...(key || {}), pos: q.get('cam').split(',').map(Number), target: (q.get('tgt') || '0,0.6,0').split(',').map(Number), fov: +(q.get('fov') || 30), shift: (q.get('shift') || '0,0').split(',').map(Number) };

// camera rail through all chapters (tools/3d/camera-path.js): p = 0…9, or film=1 for frame-by-frame capture
let path = null;
if (q.get('p') || q.get('film')) {
  const [{ CHAPTERS }, { cameraPath }] = await Promise.all([import('./chapters.js'), import('./camera-path.js')]);
  path = cameraPath(CHAPTERS, { portrait });
  key = path.sample(+(q.get('p') || 0));
}

// headlights (front units white, rear units red): level 0…1, from the chapter key / rail, or lights=0|1
const uFront = { value: q.get('lights') ? +(q.get('lights') === '1') : (key ? +key.lights || 0 : 0) };
const headlamps = [];
if (mode === 'final') {
  // front and rear lamps share one mesh in this model, so the glow is picked per fragment by world z
  const BROWY = +(q.get('browy') || 0.655);
  // the two projector discs of each headlamp (model space, x mirrored; measured from the lamp mesh):
  // c = centre (x, y), z = disc plane, r = disc radius
  const PROJ = [{ c: [0.695, 0.605], z: 2.07, r: 0.055 }, { c: [0.595, 0.62], z: 2.135, r: 0.036 }];
  // angel eyes: a thin light ring round each projector (parking lights, always on; brighter with the
  // headlights). The model has none; angel=0 to hide, angelk= brightness
  if (q.get('angel') !== '0') {
    const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.78, 0.86, 1.0) });
    const ANGEL = +(q.get('angelk') || 1);
    // bright enough to cross the bloom threshold: a soft glow round a light guide, not a white wire
    const setRing = v => ringMat.color.setRGB(0.78, 0.86, 1.0).multiplyScalar(ANGEL * (9 + 5 * v));
    window.__setRing = setRing; setRing(0);
    for (const sx of [1, -1]) for (const p of PROJ) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(p.r * 0.94, 0.0038, 10, 72), ringMat);
      ring.position.set(sx * p.c[0], p.c[1], p.z + 0.006);
      root.add(ring);
    }
  }
  root.traverse(o => {
    if (!o.isMesh || o.userData.matName !== 'lights') return;
    const m = o.material = o.material.clone();
    m.emissive = new THREE.Color(0xffffff);
    m.onBeforeCompile = sh => {
      sh.uniforms.uFront = uFront;
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vWl;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvWl = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `#include <common>
varying vec3 vWl;
uniform float uFront;
// 0…1 inside a projector lens (bright core), measured on the two projector discs of each lamp
float lensCore() {
  vec2 p = vec2(abs(vWl.x), vWl.y);
  float a = 1.0 - smoothstep(0.016, 0.034, distance(p, vec2(${PROJ[0].c.join(', ')})));
  float b = 1.0 - smoothstep(0.012, 0.026, distance(p, vec2(${PROJ[1].c.join(', ')})));
  return max(a, b);
}`)
        // side repeaters in the gills share the lamp mesh: dark amber glass, not white plastic
        .replace('#include <color_fragment>', '#include <color_fragment>\nif (abs(vWl.z) < 1.5) diffuseColor.rgb *= vec3(0.30, 0.16, 0.04);')
        // lamps are the only things far brighter than white, so only they cross the bloom threshold.
        // Front: a bright core in each projector lens and a dim bowl round it (a flat disc lit edge to
        // edge read as a white blob); the stepped "eyebrow" above them is the turn indicator (off; browy=).
        // Rear: only the tail-lamp clusters (0.70-0.95 m) glow, deep red; the bumper reflectors and the
        // third brake light stay unlit red glass, as on a parked car with its lights on.
        .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
if (vWl.z > 1.5) {
  float below = 1.0 - smoothstep(${(BROWY - 0.004).toFixed(4)}, ${(BROWY + 0.004).toFixed(4)}, vWl.y);
  totalEmissiveRadiance = vec3(1.0, 0.96, 0.9) * uFront * below * (0.6 + 9.0 * lensCore());
} else if (vWl.z < -1.5) {
  float tail = smoothstep(0.69, 0.71, vWl.y) * (1.0 - smoothstep(0.94, 0.96, vWl.y));
  totalEmissiveRadiance = vec3(0.62, 0.006, 0.004) * 1.6 * tail;
} else totalEmissiveRadiance = vec3(0.0);`);
    };
  });
  // always in the scene (intensity 0 when off), so fading them never recompiles a shader
  for (const x of [0.62, -0.62]) {
    const hl = new THREE.SpotLight(0xfff1dc, 0, 30, 0.42, 0.6, 1.6); hl.position.set(x, 0.72, 2.25); hl.target.position.set(x * 1.6, 0, 12); scene.add(hl, hl.target); headlamps.push(hl);
  }
}
// beam = how much the two headlight spots light the road (key.beam, default 1); the lamps' own glow stays.
// A camera standing in front of the car is inside the beams, and the wet road under it would burn out.
const BEAMK = +(q.get('beamk') ?? 1); // test knob: scales every beam
const setLights = (v, beam = 1) => { uFront.value = v; headlamps.forEach(h => { h.intensity = 40 * v * beam * BEAMK; }); window.__setRing?.(v); };
setLights(uFront.value, key?.beam ?? 1);

const v3 = a => (a.isVector3 ? a : new THREE.Vector3().fromArray(a));
// The portrait keys are framed for 4:5. A phone screen is narrower (≈ 9:19.5): keep the 4:5 horizontal
// field of view and show more above and below instead of cutting the car at the sides.
const PORTRAIT_REF = 0.8;
const fitFov = fov => (portrait && W / H < PORTRAIT_REF
  ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov) / 2) * PORTRAIT_REF / (W / H)))
  : fov);
function applyKey(k) {
  camera.fov = fitFov(k.fov); camera.position.copy(v3(k.pos)); camera.lookAt(v3(k.target));
  const [sx, sy] = k.shift || [0, 0];
  camera.setViewOffset(W, H, -sx * W / 2, sy * H / 2, W, H); camera.updateProjectionMatrix();
}

if (key) {
  applyKey(key);
} else {
  // camera: azimuth deg (0 = front, +z front), elevation deg, distance m
  const az = THREE.MathUtils.degToRad(+(q.get('az') ?? 35)), el = THREE.MathUtils.degToRad(+(q.get('el') ?? 12)), d = +(q.get('d') || 9.5);
  const tgt = new THREE.Vector3(0, +(q.get('ty') || 0.6), +(q.get('tz') || 0));
  camera.position.set(tgt.x + d * Math.cos(el) * Math.sin(az), tgt.y + d * Math.sin(el), tgt.z + d * Math.cos(el) * Math.cos(az));
  camera.lookAt(tgt);
}

// baked ambient occlusion (models with the `_ao` attribute, tools/3d/bl_bake_ao.py); ao=0 to compare, aok=strength
if (mode === 'final' && q.get('ao') !== '0') {
  const { applyBakedAO } = await import('./car-shading.js');
  window.__ao = applyBakedAO(root, { strength: +(q.get('aok') || 1) });
}

// per-chapter effects + driving loop (tools/3d/chapter-fx.js): fx=1. Patched after the AO so the moving
// lights are occluded in the arches and gaps like the rest of the reflections.
let fx = null, HAZE_SHADER = null;
if (FX) {
  const m = await import('./chapter-fx.js');
  HAZE_SHADER = m.HAZE_SHADER;
  fx = m.createChapterFx({ scene, root, renderer, camera, roadMaps, dashes, roadD, shutter: +(q.get('shutter') || 1 / 48) });
  if (q.get('road')) { fx.patch(g.material, { road: true }); fx.patch(paintLine); }
}

// bloom: only what is brighter than white (lit lamps, the hardest highlights) glows
let render = () => renderer.render(scene, camera);
if (mode === 'final' && q.get('bloom') !== '0') {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'), import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'), import('three/addons/postprocessing/OutputPass.js')]);
  // multisampled target: without it the frit dots on the glass edges and the carbon weave shimmer
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  const { ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js');
  // heat haze over the exhaust tips (chapter 7), off unless a plume is active
  if (fx) { window.__haze = new ShaderPass(HAZE_SHADER); window.__haze.enabled = false; composer.addPass(window.__haze); }
  // cap HDR before the bloom: pin-point glints of the street lights on glass and chrome are hundreds of
  // times brighter than white and would bloom into big square blobs; after ACES the cap is invisible
  composer.addPass(new ShaderPass({
    uniforms: { tDiffuse: { value: null }, uCap: { value: 16 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform sampler2D tDiffuse; uniform float uCap; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); gl_FragColor = vec4(min(c.rgb, vec3(uCap)), c.a); }',
  }));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), +(q.get('bloom') || 0.35), 0.3, +(q.get('bth') || 6)));
  composer.addPass(new OutputPass());
  // lens finish, after tone mapping (sRGB values): fine film grain, a little stronger in the shadows
  // (grain=amount, 0 = off) and a soft vignette that converges on the page colour #14171B, not on
  // black (vig=amount), so the canvas edge still melts into the page
  const GRAIN = +(q.get('grain') ?? 0.024), VIG = +(q.get('vig') ?? 0.45);
  let finish = null;
  if (GRAIN > 0 || VIG > 0) {
    finish = new ShaderPass({
      uniforms: { tDiffuse: { value: null }, uGrain: { value: GRAIN }, uVig: { value: VIG }, uSeed: { value: 0 }, uFlash: { value: 0 },
        uAspect: { value: W / H }, uGround: { value: new THREE.Color(0x14171b).convertLinearToSRGB() } },
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform sampler2D tDiffuse; uniform float uGrain, uVig, uSeed, uAspect, uFlash; uniform vec3 uGround; varying vec2 vUv;
float h(vec2 p) { vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }

  vec3 c = texture2D(tDiffuse, vUv).rgb;
  vec2 d = (vUv - 0.5) * vec2(uAspect, 1.0);
  float r = length(d) / length(vec2(uAspect, 1.0) * 0.5);
  c = mix(c, uGround, smoothstep(0.5, 1.05, r) * uVig);
  // limiter flash (chapter 3): --c-redline #E5482E from the frame edges, never decoration
  c = mix(c, vec3(0.898, 0.282, 0.180), uFlash * 0.55 * smoothstep(0.45, 1.05, r));
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c += (h(gl_FragCoord.xy + uSeed * 97.0) - 0.5) * uGrain * (1.15 - 0.6 * l);
  gl_FragColor = vec4(c, 1.0);
}`,
    });
    composer.addPass(finish);
  }
  window.__finish = finish;
  render = () => { if (finish) finish.uniforms.uSeed.value = (finish.uniforms.uSeed.value + 1) % 64; composer.render(); };
}
render();

// layout guide: the --c-ground scrim (0 → 85%) behind the text column + a placeholder heading
let guide = null;
if (q.get('guide') && key) {
  const o = document.createElement('div');
  const desk = 'linear-gradient(90deg, rgba(20,23,27,.85) 0%, rgba(20,23,27,.85) 30%, rgba(20,23,27,0) 50%)';
  const mob = 'linear-gradient(180deg, rgba(20,23,27,0) 48%, rgba(20,23,27,.85) 62%, rgba(20,23,27,.85) 100%)';
  o.style.cssText = `position:fixed;inset:0;background:${portrait ? mob : desk};font-family:"Segoe UI",Arial,sans-serif;color:#E8E6E1;`;
  const box = portrait ? 'left:6%;right:6%;bottom:7%;' : `left:${W * 0.055}px;width:${W * 0.33}px;top:50%;`;
  o.innerHTML = `<div style="position:absolute;${box}"><div class="g">
    <div class="k" style="font-size:13px;letter-spacing:.14em;color:#C08A5B;margin-bottom:14px"></div>
    <div class="t" style="font-size:${portrait ? 34 : Math.round(W / 26)}px;font-weight:700;line-height:1;letter-spacing:-.01em;margin-bottom:18px"></div>
    <div style="font-size:${portrait ? 15 : 17}px;line-height:1.5;color:#9EA3A8;max-width:34em">Placeholder text for the chapter. Two short lines that sit on the scrim, as on the real page.</div></div></div>`;
  document.body.appendChild(o);
  const g = o.querySelector('.g');
  // n: 1-based chapter; a: 0…1 (text panel in/out, slides up 24 px as it fades in)
  guide = (n, id, title, a = 1) => {
    o.querySelector('.k').textContent = `${String(n).padStart(2, '0')} / ${id.toUpperCase()}`;
    o.querySelector('.t').textContent = title;
    g.style.opacity = a; g.style.transform = `translateY(calc(${portrait ? 0 : -50}% + ${(1 - a) * 24}px))`;
  };
  if (path) { const c = path.keys[key.chapter]; guide(key.chapter + 1, c.id, c.title, key.rest); }
  else guide(q.get('chapter') || 1, key.id, key.title);
}

// fx HUD placeholders (the real ones are HTML on the page): tachometer in chapter 3, gear readout in 8
let hud = null;
if (guide && FX) {
  const d = document.createElement('div');
  const R = portrait ? W * 0.2 : W * 0.085, cx = portrait ? W * 0.5 : W * 0.5, cy = portrait ? H * 0.2 : H * 0.24;
  const A0 = -225, A1 = 45, ang = r => A0 + (A1 - A0) * Math.min(r, 9000) / 9000;
  const pt = (a, rr) => [cx + rr * Math.cos(a * Math.PI / 180), cy + rr * Math.sin(a * Math.PI / 180)];
  const arc = (a, b, rr) => { const [x0, y0] = pt(a, rr), [x1, y1] = pt(b, rr); return `M${x0},${y0} A${rr},${rr} 0 ${b - a > 180 ? 1 : 0} 1 ${x1},${y1}`; };
  let ticks = '';
  for (let k = 0; k <= 9; k++) { const [x0, y0] = pt(ang(k * 1000), R * 0.86), [x1, y1] = pt(ang(k * 1000), R); ticks += `<path d="M${x0},${y0} L${x1},${y1}" stroke="#9EA3A8" stroke-width="2"/>`; }
  d.style.cssText = 'position:fixed;inset:0;pointer-events:none;font-family:"Segoe UI",Arial,sans-serif;color:#E8E6E1';
  d.innerHTML = `<svg width="${W}" height="${H}" style="position:absolute;inset:0" class="tach">
    <path d="${arc(A0, A1, R)}" fill="none" stroke="#3A4047" stroke-width="3"/>
    <path d="${arc(ang(8250), A1, R)}" fill="none" stroke="#E5482E" stroke-width="5"/>${ticks}
    <line class="needle" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R * 0.92}" stroke="#C08A5B" stroke-width="3" stroke-linecap="round"/>
    <text class="rpm" x="${cx}" y="${cy + R * 0.42}" fill="#E8E6E1" font-size="${R * 0.3}" font-weight="700" text-anchor="middle"></text>
    <text x="${cx}" y="${cy + R * 0.62}" fill="#9EA3A8" font-size="${R * 0.12}" letter-spacing="2" text-anchor="middle">RPM</text></svg>
    <div class="gear" style="position:absolute;${portrait ? `left:0;right:0;top:${H * 0.08}px;text-align:center` : `left:${W * 0.5}px;top:${H * 0.12}px`}">
      <div style="font-size:13px;letter-spacing:.14em;color:#9EA3A8">GEAR</div><div class="g" style="font-size:${portrait ? 64 : W / 14}px;font-weight:700;line-height:1"></div></div>`;
  document.body.appendChild(d);
  const tach = d.querySelector('.tach'), needle = d.querySelector('.needle'), gearEl = d.querySelector('.gear');
  hud = st => {
    tach.style.display = st.rpm === null ? 'none' : '';
    gearEl.style.display = st.gear === null ? 'none' : '';
    if (st.rpm !== null) {
      needle.setAttribute('transform', `rotate(${ang(st.rpm) + 90} ${cx} ${cy})`);
      const rpm = d.querySelector('.rpm'); rpm.textContent = Math.round(st.rpm / 10) * 10; rpm.setAttribute('fill', st.rpm > 8100 ? '#E5482E' : '#E8E6E1');
    }
    if (st.gear !== null) d.querySelector('.g').textContent = st.gear;
  };
  hud({ rpm: null, gear: null });
}

// frame-by-frame capture: window.__frame(p) moves along the rail and renders
// fx=1: __frame(p, ft, dt) — ft = 0…1 inside a chapter's hold (null on a leg), dt = seconds per frame
if (path) {
  const s = { pos: new THREE.Vector3(), target: new THREE.Vector3(), shift: [0, 0] };
  const base = { env: scene.environmentIntensity, bg: scene.backgroundIntensity, sky: window.__backdrop?.value, road: g.material.envMapIntensity, line: paintLine?.envMapIntensity };
  window.__frame = (p, ft = null, dt = 1 / 24, draw = true) => {
    path.sample(p, s); applyKey(s);
    if (fx) {
      const st = fx.update({ p, ft, dt });
      setLights(st.lights, s.beam);
      camera.position.y += st.dip;
      camera.rotateX(st.rot[0]); camera.rotateY(st.rot[1]); camera.rotateZ(st.rot[2]);
      scene.environmentIntensity = base.env * (0.15 + 0.85 * st.dim);
      scene.backgroundIntensity = base.bg * st.dim;
      if (window.__backdrop) window.__backdrop.value = base.sky * st.dim;
      g.material.envMapIntensity = base.road * st.dim;
      if (paintLine) paintLine.envMapIntensity = base.line * st.dim;
      if (window.__haze) { window.__haze.enabled = st.haze > 0.001; if (window.__haze.enabled) fx.projectHaze(window.__haze.uniforms, st.haze); }
      if (window.__finish) window.__finish.uniforms.uFlash.value = st.flash;
      hud?.(st);
    } else setLights(s.lights, s.beam);
    if (guide) { const c = path.keys[s.chapter]; guide(s.chapter + 1, c.id, c.title, ft !== null && fx ? 1 : smoothRest(s.rest)); }
    if (draw) render();
  };
  // a still from inside a hold: play the hold up to ft (hold= seconds, default 3) so speed, springs and
  // heat are where they would be, then render. p=3&ft=0.6&fx=1
  if (fx) {
    const p0 = +(q.get('p') || 0), ft = q.get('ft'), fr = Math.round(+(q.get('hold') || 3) * 24);
    for (let k = 0; k < 48; k++) window.__frame(p0, ft !== null ? 0 : null, 1 / 24, false);
    if (ft !== null) for (let k = 1; k <= Math.round(+ft * fr); k++) window.__frame(p0, k / fr, 1 / 24, false);
    window.__frame(p0, ft !== null ? +ft : null, 1 / 24, true);
  }
}
// text panel: fully in around a key, gone in the middle third of a leg
function smoothRest(r) { const t = Math.min(Math.max((r - 0.35) / 0.4, 0), 1); return t * t * (3 - 2 * t); }
const wheels = []; root.traverse(o => { if (/^wheel_/.test(o.name)) { wheels.push(o.name); if (q.get('spin')) o.rotation.x += +q.get('spin'); } });
const glx = renderer.getContext(), dbg = glx.getExtension('WEBGL_debug_renderer_info');
const info = { smooth: window.__smooth, gpu: dbg ? glx.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?', wheelDetail: window.__wheels, bbox: size.toArray().map(v => +v.toFixed(3)), scale: s, wheels };
if (q.get('survey')) {
  // world-space bounding boxes per material and per wheel node, to aim the chapter cameras
  root.updateMatrixWorld(true);
  const r3 = v => v.toArray().map(n => +n.toFixed(3));
  const byMat = {}, byNode = {};
  root.traverse(o => {
    if (o.isMesh) {
      const n = (gltf.parser.associations.get(o.material) && o.material.name) || o.material.name || '?';
      const b = new THREE.Box3().setFromObject(o);
      (byMat[n] ||= new THREE.Box3()).union(b);
    }
    if (/^wheel_/.test(o.name)) byNode[o.name] = new THREE.Box3().setFromObject(o);
  });
  const props = {};
  root.traverse(o => { if (o.isMesh) { const m = o.material; props[o.userData.matName] = { type: m.type, transparent: m.transparent, opacity: m.opacity, alphaTest: m.alphaTest, blending: m.blending, side: m.side, map: !!m.map, alphaMap: !!m.alphaMap, metal: m.metalness, rough: m.roughness, color: m.color?.getHexString(), emissive: m.emissive?.getHexString(), emissiveMap: !!m.emissiveMap, depthWrite: m.depthWrite }; } });
  info.props = props;
  info.materials = Object.fromEntries(Object.entries(byMat).map(([k, b]) => [k, { min: r3(b.min), max: r3(b.max) }]));
  // roof profile on the centre line (|x| < 0.3): highest paint / glass point per 5 cm of z,
  // and the paint's half-width at roof height, to place the carbon panel
  const prof = {}, wide = {}, p = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !['paint', 'glass'].includes(o.userData.matName)) return;
    const a = o.geometry.attributes.position;
    for (let i = 0; i < a.count; i++) {
      p.fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld);
      const zb = (Math.round(p.z * 20) / 20).toFixed(2);
      if (Math.abs(p.x) < 0.3 && p.y > 1.1) { const r = (prof[zb] ||= {}); r[o.userData.matName] = Math.max(r[o.userData.matName] || 0, +p.y.toFixed(3)); }
      if (o.userData.matName === 'paint' && p.y > 1.2) wide[zb] = Math.max(wide[zb] || 0, +Math.abs(p.x).toFixed(3));
    }
  });
  info.roof = Object.keys(prof).sort((a, b) => a - b).map(z => `${z}: paint ${prof[z].paint || '-'} glass ${prof[z].glass || '-'} halfW ${wide[z] || '-'}`);
  info.nodes = Object.fromEntries(Object.entries(byNode).map(([k, b]) => [k, { min: r3(b.min), max: r3(b.max) }]));
}
document.title = 'READY ' + JSON.stringify(info);
window.__done = true;
</script></body></html>
